<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Kiosque Club d'Échecs - Vaison</title>
    <style>
        * { box-sizing: border-box; }
        body { 
            background: #161512; 
            color: #ffffff; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            text-align: center; 
            margin: 0;
            padding: 50px 20px;
        }
        h1 { 
            margin-bottom: 50px; 
            font-size: 45px;
            letter-spacing: 1px;
            color: #e4e2dd;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 38px;
            max-width: 1400px;
            margin: 0 auto;
        }
        .card {
            background: #ffffff;
            border: 3px solid #dcd6cd;
            border-radius: 18px;
            text-decoration: none;
            overflow: hidden;
            transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 35px 25px;
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.35);
        }
        .card:hover {
            transform: translateY(-6px);
            border-color: #8ab359;
            box-shadow: 0 10px 25px rgba(138, 179, 89, 0.4);
        }
        .logo-box {
            width: 100%;
            height: 110px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .logo-box img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            display: block;
        }
    </style>
</head>
<body>

    <h1>Kiosque du Club d'Échecs - Vaison</h1>

    <div class="grid">
        <!-- Ligne 1 -->
        <a class="card" href="https://lichess.org" target="_blank">
            <div class="logo-box"><img src="lichess.png" alt="Lichess"></div>
        </a>
        <a class="card" href="https://www.chess.com" target="_blank">
            <div class="logo-box"><img src="chesscom.png" alt="Chess.com"></div>
        </a>
        <a class="card" href="https://blitztactics.com" target="_blank">
            <div class="logo-box"><img src="blitztactics.png" alt="BlitzTactics"></div>
        </a>
        <a class="card" href="ffe.html" target="_blank">
            <div class="logo-box"><img src="FFE echecs.jpg" alt="FFE"></div>
        </a>

        <!-- Ligne 2 -->
        <a class="card" href="https://www.google.com" target="_blank">
            <div class="logo-box"><img src="google.png" alt="Google"></div>
        </a>
        <a class="card" href="https://lidraughts.org" target="_blank">
            <div class="logo-box"><img src="lidraughts.jpg" alt="Lidraughts"></div>
        </a>
        <a class="card" href="https://vaison-echecs.fr" target="_blank">
            <div class="logo-box"><img src="site club.jpg" alt="Vaison Échecs"></div>
        </a>
        <a class="card" href="https://jstris.jezevec10.com/?mode=1" target="_blank">
            <div class="logo-box"><img src="tetris.png" alt="Tetris"></div>
        </a>
    </div>

</body>
</html>
