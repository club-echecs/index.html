<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Kiosque du Club Vaison-Échecs</title>
    <link rel="icon" type="image/png" href="tenaille.png">
    <style>
        * { box-sizing: border-box; }
        body { 
            background: #111111; 
            color: #ffffff; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            text-align: center; 
            margin: 0;
            padding: 50px 20px;
        }
        h1 { 
            margin-bottom: 50px; 
            font-size: 45px;
            letter-spacing: 1px;
            color: #e4e2dd;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 38px;
            max-width: 1400px;
            margin: 0 auto;
        }
        .card {
            background: #ffffff; 
            border-radius: 18px;
            text-decoration: none;
            overflow: visible; 
            position: relative;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 35px 25px;
            box-shadow: inset 0 0 35px rgba(0, 0, 0, 0.75), 0 10px 25px rgba(0, 0, 0, 0.5);
        }
        .card:hover {
            transform: translateY(-6px);
            box-shadow: inset 0 0 45px rgba(0, 0, 0, 0.9), 0 15px 30px rgba(138, 179, 89, 0.4);
        }
        .logo-box {
            width: 100%;
            height: 110px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: transparent;
        }
        .logo-box img {
            object-fit: contain;
            display: block;
        }
        .ffe-card {
            position: relative;
        }
        .ffe-card::after {
            content: '';
            position: absolute;
            top: 100%;
            left: 0;
            width: 100%;
            height: 20px;
        }
        .submenu {
            opacity: 0;
            visibility: hidden;
            transform: translateY(-8px);
            transition: opacity 0.2s ease, transform 0.2s ease, visibility 0.2s ease;
            position: absolute;
            top: calc(100% + 10px);
            left: 0;
            width: 100%;
            background: #2b2b2b;
            border: 2px solid #8ab359;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding: 12px;
            z-index: 100;
            box-shadow: 0 10px 25px rgba(0,0,0,0.8);
            pointer-events: none;
        }
        .ffe-card:hover .submenu,
        .submenu:hover {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
            pointer-events: auto;
        }
        .submenu a {
            color: #ffffff;
            background: #383838;
            padding: 8px;
            border-radius: 6px;
            text-decoration: none;
            font-size: 125%; /* Police augmentée de 125% */
            font-weight: 600;
            transition: background 0.2s, color 0.2s;
        }
        .submenu a:hover {
            background: #8ab359;
            color: #111111;
        }
    </style>
</head>
<body>

    <h1>Kiosque du Club Vaison-Échecs</h1>

    <div class="grid">
        <!-- Ligne 1 -->
        <a class="card" href="https://lichess.org" target="_blank">
            <div class="logo-box"><img src="lichess.png" alt="Lichess" style="width: 91%;"></div>
        </a>
        <a class="card" href="https://www.chess.com" target="_blank">
            <div class="logo-box"><img src="chesscom.png" alt="Chess.com" style="width: 92%;"></div>
        </a>
        <a class="card" href="https://blitztactics.com" target="_blank">
            <div class="logo-box"><img src="blitztactics.png" alt="BlitzTactics" style="width: 88%;"></div>
        </a>
        <a class="card" href="https://lidraughts.org" target="_blank">
            <div class="logo-box"><img src="lidraughts.png" alt="Lidraughts" style="width: 55%;"></div>
        </a>

        <!-- Ligne 2 -->
        <a class="card" href="https://www.google.com" target="_blank">
            <div class="logo-box"><img src="google.png" alt="Google" style="width: 91%;"></div>
        </a>
        
        <!-- Tuile FFE -->
        <div class="card ffe-card">
            <a href="https://www.echecs.asso.fr" target="_blank" style="text-decoration:none; width:100%; height:100%; display:flex; align-items:center; justify-content:center;">
                <div class="logo-box"><img src="FFE echecs.png" alt="FFE" style="width: 80%;"></div>
            </a>
            <div class="submenu">
                <a href="https://www.echecs.asso.fr/Equipes.aspx?Groupe=890" target="_blank">Résultats N4</a>
                <a href="https://www.echecs.asso.fr/Equipes.aspx?Groupe=1224" target="_blank">Résultats N6</a>
                <a href="https://www.echecs.asso.fr/ListeJoueurs.aspx?Action=JOUEURCLUBREF&JrTri=Elo&ClubRef=3328" target="_blank">Liste des licenciés de Vaison</a>
                <a href="https://www.echecs.asso.fr/ListeTournois.aspx?Action=TOURNOICOMITE&ComiteRef=84" target="_blank">Tournois 84</a>
            </div>
        </div>

        <a class="card" href="https://vaison-echecs.fr" target="_blank">
            <div class="logo-box"><img src="site club.png" alt="Vaison Échecs" style="width: 68%;"></div>
        </a>
        <a class="card" href="https://jstris.jezevec10.com/?mode=1" target="_blank">
            <div class="logo-box"><img src="tetris.png" alt="Tetris" style="width: 82%;"></div>
        </a>
    </div>

</body>
</html>
